name: HANOFFICE foundation checks
on:
  push:
    branches: [main, feat/arkaon-biz-office-foundation, feat/operations-core, feat/operations-portal, feat/location-preview]
  pull_request:
    branches: [main, feat/arkaon-biz-office-foundation, feat/operations-core, feat/operations-portal]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
