name: HANOFFICE foundation checks
on:
  push:
    branches: [main, feat/han-commercial-v2, feat/arkaon-biz-office-foundation, feat/operations-core, feat/operations-portal, feat/location-preview, feat/e-contract-preview, feat/payment-sandbox, feat/integrated-preview]
  pull_request:
    branches: [main, feat/han-commercial-v2, feat/arkaon-biz-office-foundation, feat/operations-core, feat/operations-portal, feat/location-preview, feat/e-contract-preview, feat/payment-sandbox]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hanoffice
          POSTGRES_PASSWORD: hanoffice
          POSTGRES_DB: hanoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hanoffice -d hanoffice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hanoffice:hanoffice@localhost:5432/hanoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm test
      - run: npm run check
